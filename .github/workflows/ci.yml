name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://finance_test:test-only-ci-password@127.0.0.1:5432/finance_test
      TEST_DATABASE_URL: postgresql+asyncpg://finance_test:test-only-ci-password@127.0.0.1:5432/finance_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: ruff check app scripts tests alembic
      - run: ruff format --check app scripts tests alembic
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: docker build -t financial-assistant:ci .
